name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. android-1.0.1). Leave empty to only build and upload the artifact.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: conneqthub/dotnet-maui-android:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build Release APK (trimmed)
        run: dotnet build FreeserfNet.Android/FreeserfNet.Android.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk -p:PublishTrimmed=true

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-release
          path: FreeserfNet.Android/bin/Release/net10.0-android/*.apk

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v6
        with:
          name: apk-release
          path: apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Freeserf for Android

          Freeserf is a faithful re-implementation of the classic real-time strategy game **The Settlers** (Serf City). This is the Android build of freeserf.net.

          ### What's new in 1.0.2

          - **Game logic fixes** ported from the C++ freeserf releases 0.4/0.5:
            - Transporter no longer duplicate resources when switching at a flag.
            - Serfs are no longer lost when a road is removed.
            - Fixed a deadlock of serfs waiting for each other.
            - Knights can be trained even while a Knight0 is in the stock.
            - Fixed the military score and the pig farm sounds.
            - Fixed the DOS smelter sound.
          - **Save games** keep more state, so a loaded game goes on as the saved one
            (building counts, burning counters, knight morale, timers, messages,
            statistics history and more).

          ### Install

          1. Download the **net.freeserf.android-Signed.apk** below.
          2. Open the file on your Android device (or transfer it and tap it).
          3. If prompted, allow installation from unknown sources.
          4. On first start, the game asks you to pick your game data file (see below).

          ### Requirements

          - Android 5.0 (API 21) or newer
          - OpenGL ES 3.0
          - ~100 MB free storage

          ### Game data

          The game data file (SPAE.PA) is copyrighted and therefore **not** included. On first start, use the built-in file picker to select your own data file (e.g. from the original game or the free demo). The game remembers the selection for later starts.

          ### What's included

          - Full game engine (single player and network)
          - Touch controls and on-screen keyboard for save game names
          - Sound effects and MIDI music (BASS)
          - ARM (32/64-bit) and x86_64 support
          EOF
          TAG="${{ github.event.inputs.release_tag }}"
          VERSION="${TAG#android-}"
          gh release create "$TAG" apk/*-Signed.apk \
            --repo "${{ github.repository }}" \
            --title "Freeserf for Android $VERSION" \
            --notes-file release-notes.md
